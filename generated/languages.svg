<rect x="320.928" y="74" width="5.728" height="10" fill="#dea584" />
<rect x="326.656" y="74" width="4.480" height="10" fill="#663399" />
<rect x="331.136" y="74" width="3.840" height="10" fill="#427819" />
<rect x="334.976" y="74" width="1.920" height="10" fill="#89e051" />
<rect x="336.896" y="74" width="1.216" height="10" fill="#012456" />
