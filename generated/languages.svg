<svg id="gh-dark-mode-only" xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img" aria-labelledby="title description">
  <title id="title">Languages across repositories</title>
  <desc id="description">Share of repository file sizes. TypeScript 52.81%, HTML 27.27%, Python 9.68%, Astro 2.21%, JavaScript 2.00%, Rust 1.77%, CSS 1.44%, Makefile 1.19%, Shell 0.62%, PowerShell 0.37%, C# 0.19%, Other 0.43%</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .surface { fill: #ffffff; stroke: #d1d9e0; }
    .heading { fill: #1f2328; font-size: 17px; font-weight: 650; }
    .muted, .percent { fill: #59636e; font-size: 11px; }
    .language { fill: #1f2328; font-size: 11px; font-weight: 550; }
    .percent { font-variant-numeric: tabular-nums; }
    .accent { fill: #228653; }
    #gh-dark-mode-only:target .surface { fill: #0d1117; stroke: #30363d; }
    #gh-dark-mode-only:target .heading, #gh-dark-mode-only:target .language { fill: #e6edf3; }
    #gh-dark-mode-only:target .muted, #gh-dark-mode-only:target .percent { fill: #919ba6; }
    #gh-dark-mode-only:target .accent { fill: #30ba78; }
  </style>
  <defs><clipPath id="bar"><rect x="20" y="74" width="320" height="10" rx="5" /></clipPath></defs>
  <rect class="surface" x="0.5" y="0.5" width="359" height="263" rx="12" />
  <rect class="accent" x="20" y="24" width="4" height="18" rx="2" />
  <text class="heading" x="34" y="38">Languages</text>
  <text class="muted" x="20" y="58">Share of repository file sizes</text>
