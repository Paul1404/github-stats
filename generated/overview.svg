  <text class="label" x="207" y="76">Repositories contributed to</text>
  <text class="number" x="207" y="113">98</text>
  <path class="rule" d="M20 137H340" />
  <text class="detail" x="20" y="169">19</text>
  <text class="label" x="20" y="188">Stars</text>
  <text class="detail" x="207" y="169">2</text>
  <text class="label" x="207" y="188">Forks</text>
  <text class="detail" x="20" y="222">2,779,262</text>
  <text class="label" x="20" y="241">Lines changed</text>
