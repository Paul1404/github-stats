<svg id="gh-dark-mode-only" xmlns="http://www.w3.org/2000/svg" width="360" height="264" viewBox="0 0 360 264" role="img" aria-labelledby="title description">
  <title id="title">GitHub activity</title>
  <desc id="description">Paul Dresch: 7,286 all-time contributions across 98 repositories, 19 stars, 2 forks, 2,779,262 lines changed, and 99 repository views in the past 14 days.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .surface { fill: #ffffff; stroke: #d1d9e0; }
    .heading { fill: #1f2328; font-size: 17px; font-weight: 650; }
    .label { fill: #59636e; font-size: 11px; }
    .number { fill: #1f2328; font-size: 31px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .detail { fill: #1f2328; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .rule { stroke: #d8dee4; }
    .accent { fill: #228653; }
    #gh-dark-mode-only:target .surface { fill: #0d1117; stroke: #30363d; }
    #gh-dark-mode-only:target .heading, #gh-dark-mode-only:target .number, #gh-dark-mode-only:target .detail { fill: #e6edf3; }
    #gh-dark-mode-only:target .label { fill: #919ba6; }
    #gh-dark-mode-only:target .rule { stroke: #30363d; }
    #gh-dark-mode-only:target .accent { fill: #30ba78; }
  </style>
  <rect class="surface" x="0.5" y="0.5" width="359" height="263" rx="12" />
  <rect class="accent" x="20" y="24" width="4" height="18" rx="2" />
  <text class="heading" x="34" y="38">GitHub activity</text>
  <text class="label" x="20" y="76">All-time contributions</text>
